services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-medical_center}
      POSTGRES_USER: ${POSTGRES_USER:-medical_center}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-local-only-change-this-password}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-medical_center} -d ${POSTGRES_DB:-medical_center}"]
      interval: 5s
      timeout: 5s
      retries: 10
  web:
    image: medical-center-api:local
    build: .
    command: python manage.py runserver 0.0.0.0:8000
    environment:
      DJANGO_SECRET_KEY: ${DJANGO_SECRET_KEY:-local-only-replace-with-a-random-value}
      DJANGO_DEBUG: ${DJANGO_DEBUG:-1}
      DJANGO_ALLOWED_HOSTS: ${DJANGO_ALLOWED_HOSTS:-localhost,127.0.0.1,web}
      POSTGRES_DB: ${POSTGRES_DB:-medical_center}
      POSTGRES_USER: ${POSTGRES_USER:-medical_center}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-local-only-change-this-password}
      POSTGRES_HOST: db
      POSTGRES_PORT: 5432
    ports:
      - "8000:8000"
    volumes:
      - .:/app
    depends_on:
      db:
        condition: service_healthy
volumes:
  postgres_data:

